<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Ayush Kumar, DevOps Engineer: git push to production">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="0.6" stop-color="#111a24"/>
      <stop offset="1" stop-color="#0d141c"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#6b9cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6b9cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="0.1" cy="1.1" r="0.5">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .mono { font-family: Consolas, 'JetBrains Mono', Menlo, monospace; }
      .sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .k { font-size: 12px; fill: #8b97a5; }
      .v { font-size: 16px; font-weight: 600; fill: #e8ecf0; }
      .box { fill: #ffffff; fill-opacity: 0.04; stroke: #ffffff; stroke-opacity: 0.16; }
      .ok { fill: #3ddc97; fill-opacity: 0.09; stroke: #3ddc97; stroke-opacity: 0.55; }
      .arrow { fill: #6b9cff; font-size: 20px; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glowB)"/>
  <rect width="1280" height="320" fill="url(#glowG)"/>

  <text x="60" y="66" class="mono" font-size="20" fill="#8b97a5"><tspan fill="#3ddc97" font-weight="600">ayush@devops</tspan>:~$ git push origin main <tspan class="cursor" fill="#6b9cff">▍</tspan></text>

  <text x="60" y="122" class="sans" font-size="36" font-weight="700" fill="#e8ecf0">From <tspan fill="#6b9cff">git push</tspan> to production, and keeping it running.</text>

  <!-- pipeline -->
  <g class="sans">
    <rect class="box" x="60"  y="160" width="150" height="58" rx="9"/>
    <text x="74"  y="182" class="k mono">ci</text><text x="74" y="205" class="v">GitHub Actions</text>
    <text x="218" y="196" class="arrow">→</text>

    <rect class="box" x="244" y="160" width="100" height="58" rx="9"/>
    <text x="258" y="182" class="k mono">package</text><text x="258" y="205" class="v">Docker</text>
    <text x="352" y="196" class="arrow">→</text>

    <rect class="box" x="378" y="160" width="116" height="58" rx="9"/>
    <text x="392" y="182" class="k mono">registry</text><text x="392" y="205" class="v">ECR · ACR</text>
    <text x="502" y="196" class="arrow">→</text>

    <rect class="box" x="528" y="160" width="132" height="58" rx="9"/>
    <text x="542" y="182" class="k mono">deploy</text><text x="542" y="205" class="v">AWS · Azure</text>
    <text x="668" y="196" class="arrow">→</text>

    <rect class="box" x="694" y="160" width="96"  height="58" rx="9"/>
    <text x="708" y="182" class="k mono">edge</text><text x="708" y="205" class="v">NGINX</text>
    <text x="798" y="196" class="arrow">→</text>

    <rect class="ok"  x="824" y="160" width="268" height="58" rx="9"/>
    <text x="838" y="182" class="k mono">observe</text><text x="838" y="205" class="v">Prometheus · Grafana · Loki</text>
  </g>

  <text x="60" y="266" class="mono" font-size="16" fill="#8b97a5"><tspan fill="#e8ecf0" font-weight="600">Ayush Kumar · DevOps Engineer L2</tspan>  ·  CI/CD  ·  Containers  ·  Cloud infrastructure  ·  Monitoring</text>
</svg>
